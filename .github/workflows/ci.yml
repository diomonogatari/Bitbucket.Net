name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs for the same branch/PR to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Install both runtimes so the net8.0 (LTS) and net10.0 targets can be built and tested.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: bash scripts/verify-format.sh --verify

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: >
          dotnet test --no-build -c Release --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      # Runs Package Validation (EnablePackageValidation) so an accidental API break vs the
      # published baseline fails the PR here, not only at release time.
      - name: Pack (API baseline validation)
        run: dotnet pack src/Bitbucket.Net/Bitbucket.Net.csproj --no-build -c Release -o ./artifacts

      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false
